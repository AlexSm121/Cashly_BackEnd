spring.application.name=cashly_backend
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

springdoc.swagger-ui.path=/docs
springdoc.swagger-ui.use-root-path=true

springdoc.info.title=Cashly API
springdoc.info.description=API de gestão financeira
springdoc.info.version=1.0.0

# Feed de cupons (API de afiliados). Sem URL, o modo demo é usado.
cashly.coupons.api.url=${COUPON_API_URL:}
cashly.coupons.api.key=${COUPON_API_KEY:}
cashly.coupons.cache-minutes=${COUPON_CACHE_MINUTES:15}