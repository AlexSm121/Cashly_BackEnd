# Perfil local: sobe a API sem Docker/MySQL, usando banco em memória.
spring.datasource.url=jdbc:h2:mem:cashly;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;DATABASE_TO_LOWER=TRUE;NON_KEYWORDS=TRANSACTION
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Sem API de afiliados configurada, o feed usa os cupons de exemplo.
cashly.coupons.api.url=
cashly.coupons.api.key=
cashly.coupons.cache-minutes=15
